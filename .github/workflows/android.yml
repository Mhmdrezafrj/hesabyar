name: Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HesabYar_Stage1.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project package
        run: unzip -o HesabYar_Stage1.zip

      - name: Build debug APK
        run: gradle -p HesabYar_Stage1 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabYar-debug-apk
          path: HesabYar_Stage1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: HesabYar Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HesabYar_Stage4.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Stage 4 project
        run: unzip -o HesabYar_Stage4.zip

      - name: Run unit tests (parser + currency)
        run: gradle -p HesabYar_Stage4 testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HesabYar-Stage4-test-report
          path: HesabYar_Stage4/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle -p HesabYar_Stage4 assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabYar-Stage4-debug-apk
          path: HesabYar_Stage4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
